[mod-setting-name]
tf-mk2-harvest-to-chest=Feld Mk2: Ernte in die eigene Kiste

[mod-setting-description]
tf-mk2-harvest-to-chest=Wenn aktiviert, erntet das Feld Mk2 ausgewachsene Bäume direkt in seine Kiste (wie das Feld Mk1), statt sie für den Abriss durch Roboter zu markieren. Zum Herausholen einen Greifarm mit Filter auf Holz verwenden, sonst werden auch die Setzlinge mitgenommen.
