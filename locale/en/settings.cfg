[mod-setting-name]
tf-mk2-harvest-to-chest=Field Mk2: harvest into its own chest

[mod-setting-description]
tf-mk2-harvest-to-chest=When enabled, Field Mk2 harvests mature trees directly into its chest (like Field Mk1) instead of marking them for deconstruction by robots. Use a filter inserter set to wood to take the harvest out, otherwise the seeds are taken as well.
